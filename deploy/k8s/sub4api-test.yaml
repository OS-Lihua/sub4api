apiVersion: v1
kind: Namespace
metadata:
  name: sub4api-test
  labels:
    istio-injection: disabled
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: sub4api-config
  namespace: sub4api-test
data:
  AUTO_SETUP: "true"
  DATA_DIR: /app/data
  SERVER_HOST: 0.0.0.0
  SERVER_PORT: "8080"
  SERVER_MODE: release
  RUN_MODE: standard
  TZ: Asia/Shanghai
  DATABASE_HOST: postgres
  DATABASE_PORT: "5432"
  DATABASE_USER: sub4api
  DATABASE_DBNAME: sub4api
  DATABASE_SSLMODE: disable
  DATABASE_MAX_OPEN_CONNS: "20"
  DATABASE_MAX_IDLE_CONNS: "5"
  REDIS_HOST: redis
  REDIS_PORT: "6379"
  REDIS_DB: "0"
  REDIS_POOL_SIZE: "32"
  REDIS_MIN_IDLE_CONNS: "2"
  LOG_OUTPUT_TO_STDOUT: "true"
  LOG_OUTPUT_TO_FILE: "false"
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: sub4api-data
  namespace: sub4api-test
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: alicloud-disk-topology-alltype
  resources:
    requests:
      storage: 20Gi
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: sub4api-test
spec:
  clusterIP: None
  selector:
    app: sub4api-test-postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: 5432
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: sub4api-test
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels:
      app: sub4api-test-postgres
  template:
    metadata:
      labels:
        app: sub4api-test-postgres
    spec:
      automountServiceAccountToken: false
      imagePullSecrets:
        - name: acr-credential-9ebbe4b9e518e077bd23cc4d5843d509
      containers:
        - name: postgres
          image: matrix-registry-vpc.cn-shanghai.cr.aliyuncs.com/mosshub/native-postgres:18.6-amd64@sha256:d8703cd7fba306b9fec9268ecedfa8a966846c053036a60e3635791957eb2f66
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_USER
              value: sub4api
            - name: POSTGRES_DB
              value: sub4api
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: sub4api-secrets
                  key: DATABASE_PASSWORD
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "2"
              memory: 2Gi
          readinessProbe:
            exec:
              command: [sh, -ec, 'PGPASSWORD="$POSTGRES_PASSWORD" psql -h 127.0.0.1 -U "$POSTGRES_USER" -d "$POSTGRES_DB" -c "SELECT 1" >/dev/null']
            periodSeconds: 5
            timeoutSeconds: 3
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        storageClassName: alicloud-disk-topology-alltype
        resources:
          requests:
            storage: 20Gi
---
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: sub4api-test
spec:
  clusterIP: None
  selector:
    app: sub4api-test-redis
  ports:
    - name: redis
      port: 6379
      targetPort: 6379
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: redis
  namespace: sub4api-test
spec:
  serviceName: redis
  replicas: 1
  selector:
    matchLabels:
      app: sub4api-test-redis
  template:
    metadata:
      labels:
        app: sub4api-test-redis
    spec:
      automountServiceAccountToken: false
      imagePullSecrets:
        - name: acr-credential-9ebbe4b9e518e077bd23cc4d5843d509
      containers:
        - name: redis
          image: matrix-registry-vpc.cn-shanghai.cr.aliyuncs.com/mosshub/native-redis:8.10.2-amd64@sha256:2d3814be5e9b06a30a0be54770b7e12052e7e79ec85271aefd34875c1f393b23
          command: [sh, -ec]
          args:
            - exec redis-server --appendonly yes --appendfsync everysec --requirepass "$REDISCLI_AUTH"
          ports:
            - containerPort: 6379
          env:
            - name: REDISCLI_AUTH
              valueFrom:
                secretKeyRef:
                  name: sub4api-secrets
                  key: REDIS_PASSWORD
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 512Mi
          readinessProbe:
            exec:
              command: [sh, -ec, 'test "$(redis-cli ping)" = PONG']
            periodSeconds: 5
            timeoutSeconds: 3
          volumeMounts:
            - name: data
              mountPath: /data
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        storageClassName: alicloud-disk-topology-alltype
        resources:
          requests:
            storage: 20Gi
---
apiVersion: v1
kind: Service
metadata:
  name: sub4api
  namespace: sub4api-test
spec:
  type: ClusterIP
  selector:
    app: sub4api-test
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sub4api
  namespace: sub4api-test
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: sub4api-test
  template:
    metadata:
      labels:
        app: sub4api-test
    spec:
      automountServiceAccountToken: false
      imagePullSecrets:
        - name: acr-credential-d079c59eb4107dc8a1e7d939a4b06a51
        - name: acr-credential-9ebbe4b9e518e077bd23cc4d5843d509
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      initContainers:
        - name: wait-postgres
          image: matrix-registry-vpc.cn-shanghai.cr.aliyuncs.com/mosshub/native-postgres:18.6-amd64@sha256:d8703cd7fba306b9fec9268ecedfa8a966846c053036a60e3635791957eb2f66
          command: [sh, -ec]
          args:
            - until psql -h postgres -U sub4api -d sub4api -c 'SELECT 1' >/dev/null 2>&1; do sleep 3; done
          env:
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: sub4api-secrets
                  key: DATABASE_PASSWORD
        - name: wait-redis
          image: matrix-registry-vpc.cn-shanghai.cr.aliyuncs.com/mosshub/native-redis:8.10.2-amd64@sha256:2d3814be5e9b06a30a0be54770b7e12052e7e79ec85271aefd34875c1f393b23
          command: [sh, -ec]
          args:
            - until test "$(redis-cli -h redis ping 2>/dev/null)" = PONG; do sleep 3; done
          env:
            - name: REDISCLI_AUTH
              valueFrom:
                secretKeyRef:
                  name: sub4api-secrets
                  key: REDIS_PASSWORD
      containers:
        - name: sub4api
          image: matrix-registry-vpc.cn-shanghai.cr.aliyuncs.com/mosshub/sub6api:latest@sha256:c339ac324e4d5629adcfdb8a21996dd35b8a98e1eb28c5dea1a86d5587039aae
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: sub4api-config
            - secretRef:
                name: sub4api-secrets
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "2"
              memory: 2Gi
          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 120
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 15
            timeoutSeconds: 3
          volumeMounts:
            - name: data
              mountPath: /app/data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: sub4api-data
